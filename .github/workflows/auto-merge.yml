name: Auto-merge

# This privileged sweep only runs from main. It never checks out PR code
# or consumes PR artifacts or caches.
on:
  schedule:
    - cron: "0 9,17,22 * * *"
  workflow_dispatch:

# gh uses a protected environment credential, not the workflow token.
permissions: {}

concurrency:
  group: auto-merge-sweep
  cancel-in-progress: false

jobs:
  auto-merge:
    name: auto-merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment: auto-merge
    steps:
      - name: Verify required CI and request native squash auto-merge
        env:
          GH_PROMPT_DISABLED: "1"
          GH_NO_UPDATE_NOTIFIER: "1"
          GH_TOKEN: ${{ secrets.MAIN_AUTO_MERGE_TOKEN }}
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN
          : "${GH_TOKEN:?Configure MAIN_AUTO_MERGE_TOKEN in the main-only auto-merge environment}"
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_REPOSITORY" == jsolly/checkboxes ]]
          [[ "$GITHUB_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          export GH_REPO="$GITHUB_REPOSITORY"
          repo="repos/$GITHUB_REPOSITORY"
          ci_workflow_id=304190302
          failed=0

          read_eligible_pr() {
            jq -er --arg repo "$GITHUB_REPOSITORY" '
              select(.state == "open" and .draft == false and .base.ref == "main"
                and .head.repo.full_name == $repo and .base.repo.full_name == $repo
                and (.user.login | IN("solly-agent", "jsolly", "cursor[bot]", "app/cursor")))
              | [.head.sha, .base.sha] | @tsv
            '
          }

          verify_ci() {
            local number="$1" sha="$2" runs run_id attempt status conclusion jobs
            if ! runs="$(gh api --paginate --slurp "$repo/actions/workflows/$ci_workflow_id/runs?event=pull_request&head_sha=$sha&per_page=100")"; then
              echo "::error::PR #$number: reading CI runs failed" >&2
              return 2
            fi
            if ! IFS=$'\t' read -r run_id attempt status conclusion < <(
              jq -r --argjson workflow "$ci_workflow_id" --argjson pr "$number" \
                --argjson repo "$GITHUB_REPOSITORY_ID" --arg sha "$sha" '
                  [.[].workflow_runs[] | select(
                    .workflow_id == $workflow and .path == ".github/workflows/ci.yml"
                    and .name == "CI" and .display_title == "CI validation"
                    and .event == "pull_request"
                    and .head_repository.id == $repo and .head_sha == $sha
                    and any(.pull_requests[]?; .number == $pr
                      and .head.repo.id == $repo and .head.sha == $sha
                      and .base.repo.id == $repo and .base.ref == "main"))]
                  | max_by(.id) // empty
                  | [.id, .run_attempt, .status, .conclusion] | @tsv
                ' <<<"$runs"
            ); then
              return 1
            fi
            [[ "$status" == completed && "$conclusion" == success ]] || return 1
            [[ "$run_id" =~ ^[1-9][0-9]*$ && "$attempt" =~ ^[1-9][0-9]*$ ]] || return 1
            if ! jobs="$(gh api --paginate --slurp "$repo/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100")"; then
              echo "::error::PR #$number: reading CI jobs failed" >&2
              return 2
            fi
            jq -e --argjson run "$run_id" --arg sha "$sha" '
              [.[].jobs[] | select(.name == "ci" or .name == "security")]
              | (map(.name) | sort) == ["ci", "security"] and
                all(.[]; .run_id == $run and .head_sha == $sha
                  and .status == "completed" and .conclusion == "success")
            ' <<<"$jobs" > /dev/null
          }

          maybe_merge() {
            local number="$1" body pair sha base_sha verified result
            if ! body="$(gh api "$repo/pulls/$number")"; then
              echo "::error::PR #$number: reading the pull request failed" >&2
              return 1
            fi
            pair="$(read_eligible_pr <<<"$body")" || return 0
            IFS=$'\t' read -r sha base_sha <<<"$pair"
            [[ "$sha" =~ ^[0-9a-f]{40}$ && "$base_sha" =~ ^[0-9a-f]{40}$ ]] || return 1
            verified=0
            verify_ci "$number" "$sha" || verified=$?
            if [[ "$verified" != 0 ]]; then
              if [[ "$verified" == 1 ]]; then
                echo "PR #$number: required CI and security are not verified for this head."
                return 0
              fi
              return 1
            fi
            if ! body="$(gh api "$repo/pulls/$number")"; then
              echo "::error::PR #$number: re-reading the pull request failed" >&2
              return 1
            fi
            result="$(read_eligible_pr <<<"$body")" || return 0
            if [[ "$result" != "$pair" ]]; then
              echo "PR #$number: head or base changed after CI verification."
              return 0
            fi
            # Also ask GitHub to enforce the head at the merge/auto-merge request.
            # Native auto-merge and the repository's branch rules remain in force.
            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$sha"
          }

          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch)
              pages="$(gh api --paginate --slurp "$repo/pulls?state=open&base=main&per_page=100")"
              numbers="$(jq -r '[.[][] | select(.draft == false
                and (.user.login | IN("solly-agent", "jsolly", "cursor[bot]", "app/cursor")))
                | .number] | unique | .[]' <<<"$pages")"
              ;;
            *)
              echo "::error::Unexpected auto-merge event" >&2
              exit 1
              ;;
          esac

          if [[ -z "$numbers" ]]; then
            echo "No eligible pull requests."
            exit 0
          fi
          while IFS= read -r number; do
            [[ "$number" =~ ^[1-9][0-9]*$ ]] || exit 1
            maybe_merge "$number" || failed=1
          done <<<"$numbers"
          exit "$failed"
