name: Security

# Pull-request scanners. No cloud credentials. Actions are pinned to commit SHAs.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan commits added to the base branch
        run: bash scripts/security-scanners.sh gitleaks-range

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Semgrep p/default
        run: bash scripts/security-scanners.sh semgrep

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scan package-lock.json
        run: bash scripts/security-scanners.sh osv

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Offline GitHub Actions audit
        run: bash scripts/security-scanners.sh zizmor

  cfn-lint:
    name: cfn-lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Lint the static media template
        run: bash scripts/security-scanners.sh cfn-lint

  # The branch ruleset requires a check named exactly "security". This job
  # does not scan. It fails unless every scanner job succeeded.
  security:
    name: security
    needs: [gitleaks, semgrep, osv-scanner, zizmor, cfn-lint]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require every scanner to succeed
        env:
          GITLEAKS: ${{ needs.gitleaks.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          OSV_SCANNER: ${{ needs['osv-scanner'].result }}
          ZIZMOR: ${{ needs.zizmor.result }}
          CFN_LINT: ${{ needs['cfn-lint'].result }}
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "gitleaks:${GITLEAKS}" \
            "semgrep:${SEMGREP}" \
            "osv-scanner:${OSV_SCANNER}" \
            "zizmor:${ZIZMOR}" \
            "cfn-lint:${CFN_LINT}"
          do
            name="${pair%%:*}"
            result="${pair#*:}"
            printf '%s %s\n' "$name" "$result"
            if [[ "$result" != success ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "security: a scanner did not succeed"
            exit 1
          fi
          echo "security: every scanner succeeded"
