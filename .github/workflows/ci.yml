name: CI
run-name: >-
  ${{ (github.event_name != 'pull_request' ||
  (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
  (github.event.action == 'labeled' &&
   github.event.label.name == format('deps:ci:{0}', github.event.pull_request.head.sha))) && format('{0} validation', github.workflow) || 'Deferred validation' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: >-
    ${{ (github.event_name != 'pull_request' ||
    (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
    (github.event.action == 'labeled' &&
     github.event.label.name == format('deps:ci:{0}', github.event.pull_request.head.sha))) && format('ci-{0}-{1}-{2}', github.workflow, github.event.pull_request.number || github.ref, github.event_name) || format('deferred-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  ci:
    name: >-
      ${{ (github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.action == 'labeled' &&
       github.event.label.name == format('deps:ci:{0}', github.event.pull_request.head.sha))) && 'ci' || 'ci-deferred' }}
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.action == 'labeled' &&
       github.event.label.name == format('deps:ci:{0}', github.event.pull_request.head.sha))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for a validated PR tree
        id: verified-tree
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-verified-tree.sh
      - uses: actions/setup-node@v6
        if: steps.verified-tree.outputs.run_full != 'false'
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v8.2.0
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm ci
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:actions
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npx --no-install biome ci . --error-on-warnings
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:yaml
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:ts
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:knip
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm test
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run build
        if: steps.verified-tree.outputs.run_full != 'false'
      - name: Record validated PR tree
        if: >-
          success() && github.event_name == 'pull_request' &&
          steps.verified-tree.outputs.tree != ''
        uses: actions/upload-artifact@v7
        with:
          name: ci-tree-v1-${{ github.job }}-${{ steps.verified-tree.outputs.tree }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-tree-${{ github.job }}.txt
          if-no-files-found: error
          retention-days: 7
